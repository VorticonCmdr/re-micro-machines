<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Micro Machines</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="game-body">
    <header class="topbar">
      <h1>Micro Machines</h1>
      <div class="topbar-controls">
        <label>Zoom <select id="zoom">
          <option value="1">1×</option>
          <option value="2">2×</option>
          <option value="3">3×</option>
          <option value="4">4×</option>
          <option value="max" selected>Max</option>
        </select></label>
        <label class="dev-only"><input type="checkbox" id="opl-strict" /> Strict OPL2 (sine only)</label>
        <label class="dev-only"><input type="checkbox" id="lapline-toggle" /> Lap line (dev)</label>
        <button id="pick-folder" type="button" hidden>Open game folder…</button>
        <a class="viewer-link dev-only" href="single.html?dev">Single race →</a>
        <a class="viewer-link dev-only" href="editor.html">Level Editor →</a>
        <a class="viewer-link dev-only" href="viewer.html">Asset Viewer →</a>
      </div>
    </header>
    <main id="stage" class="stage stage-center">
      <canvas id="game-canvas" class="race-canvas"></canvas>
    </main>
    <script type="module" src="/src/game-entry.js"></script>
  </body>
</html>
